name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Build the Browser link extension (Chrome, Edge, Brave and Firefox zips)
              run: |
                  npm run build:extension
                  ext=$(node -p "require('./extension/manifest.json').version")
                  (cd extension/dist && zip -qr "../../ai-chatbridge-browser-link-chrome-${ext}.zip" .)
                  (cd extension/dist-firefox && zip -qr "../../ai-chatbridge-browser-link-firefox-${ext}.zip" .)

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  # Release notes: this version's section of CHANGELOG.md, if there is one.
                  awk -v v="$tag" 'index($0, "## " v " ") == 1 || $0 == "## " v {f=1; next} /^## /{if (f) exit} f' CHANGELOG.md > notes.md || true
                  [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md

                  files="main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }} $(ls ai-chatbridge-browser-link-*.zip)"

                  # A release made on github.com (publishing it creates the tag) already exists:
                  # attach the files to it, and fill in its notes if it has none.
                  if gh release view "$tag" > /dev/null 2>&1; then
                    gh release upload "$tag" $files --clobber
                    if [ -z "$(gh release view "$tag" --json body --jq .body)" ]; then
                      gh release edit "$tag" --title="$tag" --notes-file notes.md
                    fi
                  else
                    gh release create "$tag" \
                      --title="$tag" \
                      --notes-file notes.md \
                      --draft \
                      $files
                  fi
